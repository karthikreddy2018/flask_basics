<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>

<body>

    <h1>Student Form</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>Name:</label>
        <input type="text" name="username">

        <br><br>

        <label>Age:</label>
        <input type="number" name="age">

        <br><br>

         <label>City:</label>
        <input type="text" name="city">

        <br><br>

        <button type="submit" action="{{ url_for('profile') }}">Submit</button>

    </form>
    <a href="{{ url_for('home') }}">
    <button type="button">Return To Home</button>
</a>

</body>
</html>
